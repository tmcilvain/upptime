# Change these first
owner: tmcilvain # Your GitHub organization or username, where this repository lives
repo: upptime # The name of this repository

sites:
  - name: Tim McIlvain
    url: https://timmcilvain.com
  - name: Grace Tutoring
    url: https://gracetutoring.com
  - name: Ron McIlvain
    url: https://ronmcilvain.com

status-website:
  # Custom domain — a subdomain, not the apex, so DNS just needs a single
  # CNAME record on Porkbun pointing "status" at tmcilvain.github.io.
  # baseUrl is unset since the site is served at the domain's root, not a
  # /upptime subpath, once the custom domain is live.
  cname: status.mcilvain.app
  logoUrl: https://timmcilvain.com/assets/favicon.png
  name: Status
  introTitle: "**Status** — uptime for Tim McIlvain's sites."
  introMessage: Live status and uptime history for timmcilvain.com and related personal sites. Powered by [Upptime](https://github.com/upptime/upptime) — GitHub Actions, Issues, and Pages, no server required.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
